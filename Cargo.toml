[workspace]
resolver = "3"
members = ["pem"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
tokio = { version = "1.54.1", features = ["full"] }
tokio-rustls = "0.26.6"
flate2 = "1.1.11"
base64 = "0.23.1"
rustls-pki-types = "1.15.1"
rustls-pemfile = "2.2.0"
strum = { version = "0.28.0", features = ["derive"] }
pem = { path = "pem" }
